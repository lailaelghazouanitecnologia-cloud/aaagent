# A1: Flat embedding + Masked Diffusion
# Tests whether diffusion alone performs well without structured embeddings

_base_: "../base.yaml"

model:
  embedding:
    type: "flat"
    use_gate: false
    use_hierarchy: false
    fine_clusters: 0
    coarse_clusters: 0

losses:
  lambda_balance: 0.0
  lambda_diversity: 0.0
  lambda_hierarchy: 0.0

training:
  structural_warmup:
    gate_freeze_steps: 0
    gate_ramp_end_steps: 0
    cluster_unfreeze_step: 0

wandb:
  run_name: "A1-flat-diffusion"
  tags: ["ablation", "flat", "diffusion"]
