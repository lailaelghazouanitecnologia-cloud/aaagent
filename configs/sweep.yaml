# Hyperparameter sweep ranges for HCLM-D

method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  training.lr:
    min: 1.0e-4
    max: 1.0e-3
    distribution: log_uniform_values

  training.weight_decay:
    values: [0.01, 0.05, 0.1, 0.2]

  model.embedding.fine_clusters:
    values: [16, 32, 64, 128]

  model.embedding.coarse_clusters:
    values: [4, 8, 16]

  model.embedding.gate_min:
    values: [0.0, 0.05, 0.1, 0.2]

  model.embedding.alpha_init:
    values: [0.05, 0.1, 0.2, 0.5]

  model.embedding.beta_init:
    values: [0.01, 0.05, 0.1, 0.2]

  losses.lambda_balance:
    min: 0.001
    max: 0.1
    distribution: log_uniform_values

  losses.lambda_diversity:
    min: 0.0001
    max: 0.01
    distribution: log_uniform_values

  losses.lambda_hierarchy:
    min: 0.001
    max: 0.1
    distribution: log_uniform_values

  diffusion.sampling_steps:
    values: [16, 32, 64, 128]

  model.transformer.dropout:
    values: [0.0, 0.05, 0.1, 0.2]

early_terminate:
  type: hyperband
  min_iter: 5000
  s: 2
