# v5 — hier-boost+meta: v4 + meta-optimizer after 50k steps
# Full system with all components active.
# Only run after v4 proves hierarchy helps.
# z86 train --config configs/versions/v5_hier_boost_meta.yaml

_base_: "../base.yaml"

version:
  tag: "hier-boost+meta"
  note: "v4 + meta-optimizer activates at step 50k"

model:
  embedding:
    type: "hierarchical"
    fine_clusters: 64
    coarse_clusters: 8
    gate_min: 0.1
    alpha_init: 0.1
    beta_init: 0.15
    use_gate: true
    use_hierarchy: true

losses:
  lambda_balance: 0.01
  lambda_diversity: 0.001
  lambda_hierarchy: 0.05

training:
  structural_warmup:
    gate_freeze_steps: 500
    gate_ramp_end_steps: 2000
    cluster_unfreeze_step: 500
    coarse_unfreeze_step: 3000

    temp_anneal_start: 2000
    temp_anneal_end: 20000
    temp_start: 1.0
    temp_end: 0.3
    # Coarse router uses 60% of fine temperature (sharper routing for M=8)
    coarse_temp_ratio: 0.6

    loss_ramp_start: 2000
    loss_ramp_end: 20000
    loss_multiplier_min: 0.1
    loss_multiplier_hierarchy_max: 10.0
    loss_multiplier_balance_max: 5.0
    loss_multiplier_diversity_max: 10.0

  # Use more VRAM: larger batch
  batch_size: 96

  # Hierarchy optimization: LLM-guided A* search
  hierarchy:
    enabled: true
    run_every_steps: 5000
    start_after_step: 5000
    llm_backend: "groq"
    max_search_nodes: 20
    max_search_depth: 3
    beam_width: 5

  meta:
    enabled: true
    enable_after_step: 50000
    meta_lr: 1.0e-4
    update_every: 100
    hidden_dim: 128

wandb:
  run_name: "v5-hier-boost-meta"
  tags: ["version", "hierarchy", "boost", "meta-optimizer"]
